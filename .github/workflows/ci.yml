name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Not `npm ci`, and the reason is worth writing down so nobody switches
      # it back.
      #
      # ganache pulls in chokidar 3.5.2, which declares fsevents as an optional
      # dependency. npm resolves it, but does not carry the optional flag onto
      # the nested lockfile entry, so `node_modules/ganache/node_modules/fsevents`
      # is recorded as a plain requirement pinned to darwin. `npm ci` is strict
      # about that and refuses on Linux with EBADPLATFORM, which is what broke
      # this workflow.
      #
      # Checked rather than assumed: regenerating the lockfile does not fix it,
      # a root `overrides` entry does not reach the nested copy, and
      # `npm ci --omit=optional` fails the same way because the entry is not
      # marked optional in the first place. Hand-editing the lockfile would fix
      # it and would be undone by the next `npm install`.
      #
      # `npm install --no-save` installs the same tree from the same lockfile,
      # skips the darwin-only package as unbuildable rather than fatal, and
      # leaves the lockfile untouched so CI cannot quietly drift.
      - run: npm install --no-save --no-audit --no-fund
      - run: npm test
      - run: npm run build:web

      # The API key is server-side only. If it ever reaches the browser bundle,
      # fail the build rather than shipping it.
      - name: Check client bundle for secrets
        run: |
          if grep -rEl "xai-[A-Za-z0-9]{10,}|XAI_API_KEY|api\.x\.ai" web/dist/assets/ 2>/dev/null; then
            echo "Secret or model endpoint found in the client bundle"
            exit 1
          fi
          echo "Client bundle is clean"
