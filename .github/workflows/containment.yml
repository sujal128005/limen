name: Containment

on:
  push:
  pull_request:

jobs:
  containment:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Same install strategy as ci.yml — see comment there for the ganache/fsevents rationale.
      - name: Install dependencies
        run: npm install --no-save --no-audit --no-fund

      - name: Unit and integration tests
        run: npm test

      # Server start and adversary run live in ONE step, deliberately.
      #
      # They used to be two. A process backgrounded with `&` belongs to the
      # step's own shell, and the runner is free to reap that process group
      # when the step exits, so the next step reached a dead port and the CLI
      # reported "did not become ready" as though the server had never
      # started. Keeping both in one step means the shell that owns the server
      # is the same shell that runs the attacks.
      #
      # The readiness loop replaces the CLI's own 30s window, which is too
      # tight for a cold runner: boot compiles the contracts with solc and
      # registers 15 suppliers on-chain before /api/status reports ready.
      # Ninety seconds costs nothing when the server is up in ten.
      - name: Start server and run adversary checks
        run: |
          nohup node server/index.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 90); do
            if curl -sf -m 2 http://localhost:4000/api/status | grep -q '"ready":true'; then
              echo "server ready after ${i}s"
              break
            fi
            if [ "$i" = "90" ]; then
              echo "server never became ready in 90s"
              cat server.log
              exit 1
            fi
            sleep 1
          done
          node scripts/adversary.js --ci
        env:
          LIMEN_LOCAL_SETTLE_MS: '3600000'
          LIMEN_RATE_LIMIT: '2000'
          GIT_COMMIT_SHA: ${{ github.sha }}

      # Without this a failure shows the CLI's one-line complaint and nothing
      # about why the server was unhappy, which is the position this workflow
      # left us in the first time it went red.
      - name: Server log on failure
        if: failure()
        run: cat server.log || true

      # Download the containment report PDF so it is visible in the Actions UI.
      - name: Generate containment report
        if: always()
        run: |
          node -e "
          const http = require('http');
          const fs = require('fs');

          // Login to get a token
          function post(path, body, ws) {
            return new Promise((resolve, reject) => {
              const data = Buffer.from(JSON.stringify(body));
              const req = http.request({
                hostname: 'localhost', port: 4000, path,
                method: 'POST',
                headers: { 'content-type': 'application/json', 'content-length': data.length,
                           ...(ws ? { 'x-workspace': ws } : {}) }
              }, res => {
                const chunks = [];
                res.on('data', c => chunks.push(c));
                res.on('end', () => resolve(JSON.parse(Buffer.concat(chunks))));
              });
              req.on('error', reject);
              req.write(data);
              req.end();
            });
          }

          async function run() {
            const ws = 'ci-report-' + Date.now().toString(36);
            const loginR = await post('/api/session/login', { role: 'sales', code: '2481' }, ws).catch(() => null);
            if (!loginR || !loginR.token) { console.log('Could not login for report'); return; }
            const startR = await post('/api/adversary/run', {}, ws).catch(() => null);
            if (!startR || !startR.runId) { console.log('Could not start run for report'); return; }
            const runId = startR.runId;
            // Poll up to 5 min
            for (let i = 0; i < 150; i++) {
              await new Promise(r => setTimeout(r, 2000));
              const res = await new Promise((resolve, reject) => {
                http.get({ hostname: 'localhost', port: 4000, path: '/api/adversary/run/' + runId,
                           headers: { 'x-workspace': ws, authorization: 'Bearer ' + loginR.token } },
                  r => { const ch = []; r.on('data', c => ch.push(c)); r.on('end', () => resolve(JSON.parse(Buffer.concat(ch)))); }
                ).on('error', reject);
              });
              if (res.status === 'complete') {
                // Download PDF
                const pdfPath = '/api/adversary/run/' + runId + '/report.pdf';
                const pdf = await new Promise((resolve, reject) => {
                  http.get({ hostname: 'localhost', port: 4000, path: pdfPath,
                             headers: { 'x-workspace': ws, authorization: 'Bearer ' + loginR.token } },
                    r => { const ch = []; r.on('data', c => ch.push(c)); r.on('end', () => resolve(Buffer.concat(ch))); }
                  ).on('error', reject);
                });
                fs.writeFileSync('containment-report.pdf', pdf);
                console.log('Report written: containment-report.pdf (' + pdf.length + ' bytes)');
                return;
              }
            }
            console.log('Timed out waiting for report run');
          }

          run().catch(e => { console.error('Report generation failed:', e.message); });
          "
        continue-on-error: true

      - name: Upload containment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: containment-report-${{ github.run_number }}
          path: containment-report.pdf
          if-no-files-found: warn
