<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Limen | AI procurement for Indian manufacturers</title>
    <meta name="description" content="Procurement agents that source and negotiate, with spending authority enforced by contract." />
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"%3E%3Cpath d="M6.8 29.6V20.8Q6.8 12 15.6 12H32.4Q41.2 12 41.2 20.8V25.2" fill="none" stroke="%23174A40" stroke-width="5.2" stroke-linejoin="round"/%3E%3Cpath d="M4.2 32.8H23.6L21.2 38H4.2z" fill="%23E2B862"/%3E%3C/svg%3E' />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A1220" media="(prefers-color-scheme: dark)" />

    <!--
      Resolve the theme before the first paint.

      React mounts a frame or two after the document parses. If the theme were
      applied in a component, a person who chose dark would get a white flash
      first, which looks broken rather than merely imperfect. This runs
      synchronously in the head, so the correct palette is on the element
      before anything is painted.

      It is deliberately dependency free and wrapped in try/catch: a browser
      with storage disabled should fall back to the system preference, not
      throw and leave the page unstyled.
    -->
    <script>
      /*
       * Limen is built for screens of 11 inches and up: laptops, desktops and
       * large tablets, which get the responsive layout. A phone (shortest side
       * under 600 CSS pixels; no laptop is that small) is shown the laptop layout instead, at 1280px
       * wide, which it can pinch and zoom like any desktop site.
       */
      (function () {
        try {
          var s = window.screen;
          if (s && Math.min(s.width, s.height) < 600) {
            var vp = document.querySelector('meta[name="viewport"]');
            if (vp) vp.setAttribute('content', 'width=1280');
            document.documentElement.setAttribute('data-device', 'phone');
          }
        } catch (e) { /* keep the default viewport */ }
      })();
      (function () {
        try {
          var saved = localStorage.getItem('limen.theme') || 'light';
          var dark = saved === 'dark' ||
            (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
