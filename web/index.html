    <!--
      Resolve the theme before the first paint.

      React mounts a frame or two after the document parses. If the theme were
      applied in a component, a person who chose dark would get a white flash
      first, which looks broken rather than merely imperfect. This runs
      synchronously in the head, so the correct palette is on the element
      before anything is painted.

      It is deliberately dependency free and wrapped in try/catch: a browser
      with storage disabled should fall back to the system preference, not
      throw and leave the page unstyled.
    -->
    <script>
      /*
       * The home page and legal pages are responsive on phones. Everything else
       * is built for screens of 11 inches and up, so a phone (shortest side
       * under 600 CSS pixels) gets it at laptop width, 1280px, and a one-time
       * notice (src/screen.js).
       */
      (function () {
        try {
          var s = window.screen;
          var home = (location.pathname === '/' && !/[?&]demo=/.test(location.search))
            || /^\/(privacy|terms)$/.test(location.pathname);
          if (s && Math.min(s.width, s.height) < 600 && !home) {
            var vp = document.querySelector('meta[name="viewport"]');
            if (vp) vp.setAttribute('content', 'width=1280');
            document.documentElement.setAttribute('data-device', 'phone');
          }
        } catch (e) { /* keep the default viewport */ }
      })();
      (function () {
        try {
          var saved = localStorage.getItem('limen.theme') || 'light';
          var dark = saved === 'dark' ||
            (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
