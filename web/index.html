<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Limen | Sourcing Desk</title>
    <meta name="description" content="Procurement agents that source and negotiate, with spending authority enforced by contract." />
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"%3E%3Cpath d="M6 33V13a4 4 0 0 1 4-4h28a4 4 0 0 1 4 4v20H33V20a3 3 0 0 0-3-3H18a3 3 0 0 0-3 3v13z" fill="%230B5F52"/%3E%3Crect x="4" y="36" width="40" height="7" rx="3.5" fill="%230B5F52"/%3E%3C/svg%3E' />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)" />

    <!--
      Resolve the theme before the first paint.

      React mounts a frame or two after the document parses. If the theme were
      applied in a component, a person who chose dark would get a white flash
      first, which looks broken rather than merely imperfect. This runs
      synchronously in the head, so the correct palette is on the element
      before anything is painted.

      It is deliberately dependency free and wrapped in try/catch: a browser
      with storage disabled should fall back to the system preference, not
      throw and leave the page unstyled.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('limen.theme') || 'system';
          var dark = saved === 'dark' ||
            (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
